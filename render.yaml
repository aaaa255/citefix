# Render Blueprint. On https://dashboard.render.com choose New > Blueprint, pick this repository,
# and enter the two keys when Render asks for them. Free instances sleep after 15 idle minutes.
services:
  - type: web
    name: citefix
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
